function mapSvg(){

 const r=rng(11),o=[`<rect width="1194" height="834" fill="#6f6c5c"/>`];

 for(let y=0;y<834;y+=24)for(let x=0;x<1194;x+=24){
  if(Math.abs(x-rx(y))<56||r()<.1)continue;
  const w=12+(r()*9|0),h=12+(r()*9|0),px=x+(r()*3|0),py=y+(r()*3|0),c=roofs[r()*roofs.length|0];
  o.push(`<rect x="${px+2}" y="${py+2}" width="${w}" height="${h}" fill="#000" opacity=".28"/><rect x="${px}" y="${py}" width="${w}" height="${h}" fill="${c}"/>`);
  if(r()<.35)o.push(`<line x1="${px}" y1="${py+h/2}" x2="${px+w}" y2="${py+h/2}" stroke="#000" stroke-opacity=".15"/>`);
 }
 for(let x=118;x<1194;x+=120)o.push(`<line x1="${x}" y1="0" x2="${x}" y2="834" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>`);
 for(let y=118;y<834;y+=120)o.push(`<line x1="0" y1="${y}" x2="1194" y2="${y}" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>`);
 for(let i=0;i<9;i++)o.push(`<line x1="${r()*1194|0}" y1="${r()*834|0}" x2="${r()*1194|0}" y2="${r()*834|0}" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>`);
 [[880,660,110,70],[150,420,70,50],[960,150,90,60],[690,560,60,40],[1060,430,70,60]].forEach(p=>{
  o.push(`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[3]}" fill="#46663a"/>`);
  for(let k=0;k<70;k++){const a=r()*6.283,d=Math.sqrt(r());o.push(`<circle cx="${(p[0]+Math.cos(a)*p[2]*d).toFixed(0)}" cy="${(p[1]+Math.sin(a)*p[3]*d).toFixed(0)}" r="${3+r()*2}" fill="${r()<.5?'#3b5a2f':'#5a7d44'}" opacity=".8"/>`)}
 });

 o.push(`<polyline points="${pts}" fill="none" stroke="#586648" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>`,`<polyline points="${pts}" fill="none" stroke="#6f7d55" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`);
 o.push(`<rect width="1194" height="834" fill="#3a3a30" opacity=".3"/>`);
 [['Vaticano',200,292],['Colosseo',770,452],['Monti',610,328],['Trastevere',330,578]].forEach(l=>o.push(`<text x="${l[1]}" y="${l[2]}" text-anchor="middle" font-family="Figtree,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D1D5DB" stroke="#000" stroke-opacity=".55" stroke-width="3" paint-order="stroke">${l[0]}</text>`));
 return mapCache=`<svg class="bg" viewBox="0 0 1194 834" xmlns="http://www.w3.org/2000/svg">${o.join('')}</svg>`;
}

 if(!n){
  body=`<div class="empty">No stays inside this area.<button class="btn sec sm" data-a="rmpin">Remove pin filter</button></div>`;

  const tr=`width:${Math.max(n,3)/3*100}%;--cw:${100/n}%;transform:translateX(-${S.off*100/n}%)`;

const app=document.getElementById('app');
function render(){
 const keeps=[...document.querySelectorAll('.keep')].map(e=>e.scrollTop);
 let h='';
 if(S.screen==='explore')h=explore();
 else if(S.screen==='prospects')h=prospects();
 else if(S.screen==='compare')h=S.map?mapView():compare();
 else if(S.screen==='recipient')h=recipient();
 else if(S.screen==='calc')h=calc();
 else h=winner();
 if(S.screen==='compare'&&S.share)h+=shareModal();
 if(S.screen==='compare'&&!S.map&&S.swapMenu){const m=S.swapMenu;h+=`<div class="scrim2" data-a="menuclose"></div><div class="swapmenu" style="left:${m.x}px;top:${m.y}px;width:${m.w}px"><div class="none">No other contenders to swap in</div>${S.pin?'<button class="lnk" data-a="clearpin">Clear pin to see all stays</button>':'<button class="lnk" data-a="addmore">Add more stays</button>'}</div>`}
 if(S.screen==='compare'&&S.pending&&S.modal)h+=distModal();
 if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
 app.innerHTML=h;
 document.querySelectorAll('.keep').forEach((e,i)=>{if(keeps[i])e.scrollTop=keeps[i]});
}
let toastT;
function toast(m){S.toast=m;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render()},1800)}

const nameList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function slideRec(){const t=document.querySelector('.rtrk');if(t)t.style.transform=`translateX(-${S.rec.i*600}px)`;S.anim=true;setTimeout(()=>{S.anim=false;render()},320)}
function goCompare(ids){S.cmp=ids.slice();S.off=0;S.screen='compare';S.backTo='prospects';S.map=false}
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 const a=t.dataset.a,v=t.dataset.v;
 switch(a){
  case 'noop':return;
  case 'swapempty':{const r=t.getBoundingClientRect(),st=document.getElementById('stage').getBoundingClientRect(),k=st.width/1194;
   S.swapMenu={x:(r.left-st.left)/k,y:(r.bottom-st.top)/k+6,w:r.width/k};break}
  case 'menuclose':S.swapMenu=null;break;
  case 'addmore':S.swapMenu=null;S.screen='explore';break;
  case 'clearpin':S.swapMenu=null;S.pin=null;break;
  case 'tab':if(v==='explore'||v==='prospects')S.screen=v;break;
  case 'heart':{const id=+v;
   if(S.saved.has(id)){S.saved.delete(id);S.sel.delete(id);toast('Removed from contenders')}
   else{S.saved.add(id);toast('Added to contenders')}break}
  case 'cmpsel':goCompare(STAYS.filter(s=>S.saved.has(s.id)&&S.sel.has(s.id)).map(s=>s.id));break;
  case 'cmpall':goCompare(STAYS.filter(s=>S.saved.has(s.id)).map(s=>s.id));break;
  case 'back':S.screen=S.backTo;break;
  case 'slide':{if(S.anim)return;S.swapMenu=null;S.off+=+v;S.anim=true;
   document.querySelectorAll('.trk').forEach(el=>{el.style.transform=`translateX(-${S.off*100/el.dataset.n}%)`});
   setTimeout(()=>{S.anim=false;render()},320);return}
  case 'share':S.share=true;S.shareSel=new Set();break;
  case 'scrim':if(e.target!==t)return;S.share=false;break;
  case 'send':{
   const names=SHARE.filter(p=>S.shareSel.has(p));
   S.share=false;S.rec={ids:STAYS.filter(s=>S.saved.has(s.id)).map(s=>s.id),i:0,votes:{}};S.screen='recipient';S.anim=false;
   toast('Shared with '+nameList(names));break}
  case 'seefull':S.screen='compare';S.backTo='recipient';S.map=false;S.off=0;break;
  case 'recnav':if(S.anim)return;S.rec.i+=+v;slideRec();return;
  case 'recvote':{
   const r=S.rec;r.votes[r.ids[r.i]]=v;toast('Vote saved');
   setTimeout(()=>{if(S.screen==='recipient'&&!S.anim&&S.rec.i<S.rec.ids.length-1){S.rec.i++;slideRec()}},500);
   break}
  case 'submit':S.screen='calc';setTimeout(()=>{if(S.screen==='calc'){S.screen='winner';render()}},1500);break;
  case 'vote':{const [id,x]=v.split(':');S.votes[id]=x;toast('Vote saved');break}
  case 'maptoggle':
   S.map=!S.map;S.pending=null;S.popId=null;
   if(S.map&&!S.tipSeen){S.tipSeen=true;S.tip=true;setTimeout(()=>{S.tip=false;const el=document.querySelector('.tt');if(el)el.remove()},3500)}
   break;
  case 'stay':S.popId=S.popId===+v?null:+v;break;
  case 'mapclick':if(S.popId==null)return;S.popId=null;break;
  case 'step':S.draft.min=Math.min(60,Math.max(5,S.draft.min+5*+v));break;
  case 'save':S.pin={x:S.pending.x,y:S.pending.y,mode:S.draft.mode,min:S.draft.min};S.pending=null;S.modal=false;break;
  case 'cancel':S.pending=null;S.modal=false;break;
  case 'rmpin':S.pin=null;break;
  default:return;
 }
 render();
});
app.addEventListener('change',e=>{
 const t=e.target.closest('[data-c]');if(!t)return;
 const c=t.dataset.c,v=t.dataset.v;
 if(c==='sel'){t.checked?S.sel.add(+v):S.sel.delete(+v)}
 else if(c==='share'){
  if(v==='all')S.shareSel=t.checked?new Set(SHARE):new Set();
  else t.checked?S.shareSel.add(v):S.shareSel.delete(v);
 }
 else if(c==='cur')S.cur=t.value;
 else if(c==='mode')S.draft.mode=t.value;
 else if(c==='swap'){const i=S.cmp.indexOf(+v);if(i>-1&&t.value)S.cmp[i]=+t.value}
 render();
});

app.addEventListener('pointerdown',e=>{
 const b=e.target.closest('.dropbtn');if(!b)return;
 e.preventDefault();
 const tt=document.querySelector('.tt');if(tt){tt.remove();S.tip=false}
 const map=document.querySelector('.map');
 let last=e;
 const track=ev=>{last=ev};
 const pos=ev=>{const r=map.getBoundingClientRect(),k=r.width/1194;return {x:(ev.clientX-r.left)/k,y:(ev.clientY-r.top)/k}};
 const end=()=>{clearTimeout(timer);window.removeEventListener('pointermove',track);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end)};
 const timer=setTimeout(()=>{
  window.removeEventListener('pointermove',track);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
  const g=document.createElement('div');g.className='pinmk dragpin';g.innerHTML=I.pin;map.appendChild(g);
  const place=ev=>{const p=pos(ev);g.style.left=p.x+'px';g.style.top=p.y+'px'};
  place(last);
  const up=ev=>{
   window.removeEventListener('pointermove',place);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
   g.remove();
   const p=pos(ev);
   if(ev.type==='pointerup'&&p.x>=0&&p.y>=0&&p.x<=1194&&p.y<=834){
    S.pending={x:p.x,y:p.y,bounce:true};S.modal=false;S.popId=null;S.draft={mode:'walk',min:5};render();
    setTimeout(()=>{if(S.pending){S.modal=true;render()}},500);
   }
  };
  window.addEventListener('pointermove',place);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 },500);
 window.addEventListener('pointermove',track);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
});

function fit(){document.getElementById('stage').style.transform=`scale(${Math.min(innerWidth/1194,innerHeight/834,1)})`}
addEventListener('resize',fit);fit();
render();
</script>
</body>
</html>
